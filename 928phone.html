<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Apps Mobile UI</title>
    <style>
        /* Simulação do ecrã de um telemóvel */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Carcaça do telemóvel */
        .phone-container {
            width: 360px;
            height: 740px;
            background-color: #f7f9fa;
            border-radius: 36px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
            border: 8px solid #222;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Barra de estado do topo */
        .status-bar {
            height: 24px;
            background-color: #ffffff;
            padding: 5px 20px 0;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #333;
            font-weight: 600;
        }

        /* Cabeçalho da App */
        .app-header {
            background-color: #ffffff;
            padding: 15px 20px;
            border-bottom: 1px solid #eef1f2;
        }

        .app-header h2 {
            margin: 0;
            font-size: 20px;
            color: #1a1a1a;
            font-weight: 700;
        }

        /* Zona de scroll dos aplicativos */
        .apps-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Estilo de Cartão de App Real (Toque/Clique) */
        .app-card {
            background-color: #ffffff;
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            border-left: 5px solid #0078d4;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent; /* Remove o flash azul no telemóvel */
        }

        /* Efeito de clique no telemóvel */
        .app-card:active {
            background-color: #f0f4f8;
            transform: scale(0.98);
        }

        /* Ícone redondo da aplicação */
        .app-icon {
            width: 40px;
            height: 40px;
            background-color: #f0f4f8;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Texto da app */
        .app-info {
            font-size: 15px;
            font-weight: 600;
            color: #2d3748;
        }
    </style>
</head>
<body>

    <!-- Contentor Principal (Telemóvel) -->
    <div class="phone-container">
        
        <!-- Barra de Estado de um Telefone -->
        <div class="status-bar">
            <span>11:41</span>
            <span>📶 🔋 100%</span>
        </div>

        <!-- Cabeçalho -->
        <div class="app-header">
            <h2>Aplicações Windows</h2>
        </div>

        <!-- Lista onde o loop vai injetar os cartões reais -->
        <div id="phone-apps-list" class="apps-list"></div>
    </div>

    <script>
        // Dados estruturados como numa base de dados real (Objeto JSON)
        const listaDeApps = [
            { nome: "Bloco de Notas (Notepad)", icone: "📝" },
            { nome: "Calculadora", icone: "🧮" },
            { nome: "Explorador de Arquivos", icone: "📁" },
            { nome: "Prompt de Comando (CMD)", icone: "💻" },
            { nome: "Microsoft Edge", icone: "🌐" },
            { nome: "Paint", icone: "🎨" },
            { nome: "Gerenciador de Tarefas", icone: "📊" },
            { nome: "Agendador de Tarefas", icone: "⏱️" }
        ];

        const containerMobile = document.getElementById('phone-apps-list');

        // APENAS 1 LOOP: Mapeia os dados e constrói a interface nativa de uma só vez
        listaDeApps.forEach(function(app) {
            // Criar o cartão principal
            const card = document.createElement('div');
            card.className = 'app-card';

            // Criar a estrutura interna da UI (Ícone + Texto)
            card.innerHTML = `
                <div class="app-icon">${app.icone}</div>
                <div class="app-info">${app.nome}</div>
            `;

            // Adiciona um evento de clique real para simular a abertura da app
            card.addEventListener('click', () => {
                alert(`A abrir: ${app.nome}`);
            });

            // Injeta o elemento gerado no ecrã do telemóvel
            containerMobile.appendChild(card);
        });
    </script>

</body>
</html>
